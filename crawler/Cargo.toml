[package]
name = "ferris-crawler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "ferris_crawler"
path = "src/lib.rs"

[[bin]]
name = "ferris-crawler"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
spider = { version = "2.53.4", default-features = false, features = ["sync", "basic_tls"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.13", features = ["array-impls", "with-chrono-0_4", "with-uuid-1"] }
unicode-normalization = "0.1.25"
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }
